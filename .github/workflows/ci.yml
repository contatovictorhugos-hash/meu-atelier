name: Atelier CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
      - dev

# Cancela execuções anteriores em andamento no mesmo branch para economizar recursos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint Check
        run: npm run lint

      - name: Run Automated Tests (Unit, Integration, White-Box & QA)
        run: npm run test

      - name: Dry-Run Production Build
        run: npm run build
