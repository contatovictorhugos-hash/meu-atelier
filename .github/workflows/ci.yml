name: Atelier CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master
      - dev

# Cancela execuções anteriores em andamento no mesmo branch para economizar recursos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Security, Quality & Build Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Cache inteligente do compilador Next.js para acelerar builds
      - name: Next.js Compiler Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      # Gate 1: Segurança & Prevenção de Vazamento de Segredos (Agente SI)
      - name: Security & Secret Leak Gate
        run: |
          echo "🔍 1. Verificando se há arquivos sensíveis versionados no Git..."
          TRACKED=$(git ls-files | grep -E '\.env$|\.env\.local$|\.pem$|\.key$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Arquivo sensível detectado no Git: $TRACKED"
            exit 1
          fi
          echo "✅ Nenhum arquivo .env ou chave privada versionada."

          echo "🔍 2. Verificando se há credenciais ou tokens no código..."
          SECRETS=$(git grep -E 'service_role|AIza[-0-9A-Za-z_]{35}|sk_live_[0-9a-zA-Z]{24}|PRIVATE KEY' -- ':!tests/' ':!.github/' ':!scripts/' ':!package-lock.json' || true)
          if [ -n "$SECRETS" ]; then
            echo "::error::Padrão de credencial ou chave secreta detectado: $SECRETS"
            exit 1
          fi
          echo "✅ Nenhuma credencial ou segredo hardcoded detectado."

      # Gate 2: Tipagem Rigorosa TypeScript (Zero any)
      - name: Typecheck (Strict TypeScript)
        run: npm run typecheck

      # Gate 3: Linter Next.js / ESLint
      - name: Lint Check
        run: npm run lint

      # Gate 4: Testes Automatizados (Agente QA - 84 testes)
      - name: Run Automated Tests (Unit, Integration, White-Box & QA)
        run: npm run test

      # Gate 5: Build de Produção
      - name: Dry-Run Production Build
        run: npm run build

      # Gate 6: Resumo Visual da Execução no GitHub Actions
      - name: Generate CI Job Summary
        if: always()
        run: |
          echo "## 🛡️ Atelier CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Quality & Security Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 **Security & Secrets Leak Gate** | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ **Strict TypeScript Compilation** | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 **ESLint Code Quality** | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Automated Test Suite (84 Tests)** | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **Next.js 15 Production Build** | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
